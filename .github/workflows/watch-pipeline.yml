name: Watch Pipeline

on:
  schedule:
    - cron: '0 0 */3 * *'  # every 3rd day, UTC 00:00 = CST 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-data-writes
  cancel-in-progress: false

jobs:
  fetch-all-models:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full models catalog
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://models.dev/models.json -o data/all_models.json
          echo "all_models.json: $(wc -c < data/all_models.json) bytes"

      - name: Commit all_models snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/all_models.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No all_models changes"
          else
            git commit -m "data: update all_models snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  fetch-opencode-go:
    # Ordered after fetch-all-models only to serialize commits; the go.mdx
    # list is independent of models.dev drift, so this job is never gated on it.
    needs: fetch-all-models
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch source document
        id: source
        env:
          GO_COMMIT_API_URL: https://api.github.com/repos/anomalyco/opencode/commits?path=packages/web/src/content/docs/go.mdx&sha=dev&per_page=1
        run: |
          set -euo pipefail
          latest_hash="$(curl -fsSL --max-time 30 "$GO_COMMIT_API_URL" | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["sha"])')"
          curl -fsSL --max-time 30 \
            "https://raw.githubusercontent.com/anomalyco/opencode/$latest_hash/packages/web/src/content/docs/go.mdx" \
            -o "$RUNNER_TEMP/go.mdx"
          echo "commit=$latest_hash" >> "$GITHUB_OUTPUT"

      - name: Update opencode-go section of models_extra
        run: |
          python3 watch-pipeline/scripts/watch_go.py "$RUNNER_TEMP/go.mdx" \
            --url "https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/go.mdx" \
            --source-commit "${{ steps.source.outputs.commit }}" \
            --extra data/models_extra.json

      - name: Commit models_extra
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/models_extra.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No opencode-go changes"
          else
            git commit -m "data: update opencode-go section of models_extra"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit opencode-go error state
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add watch-pipeline/reference/go/
          if ! git diff --cached --quiet; then
            git commit -m "watch-go: record failure state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

  watch-goat-models:
    # Both jobs rewrite their own section of data/models_extra.json, so the
    # writes must serialize: goat always runs after go.
    needs: [fetch-all-models, fetch-opencode-go]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update commandcode-goat section of models_extra
        run: |
          python3 watch-pipeline/scripts/watch_goat.py \
            --extra data/models_extra.json

      - name: Commit models_extra
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/models_extra.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No goat changes"
          else
            git commit -m "data: update commandcode-goat section of models_extra"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit goat error state
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add watch-pipeline/reference/goat/
          if ! git diff --cached --quiet; then
            git commit -m "watch-goat: record failure state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

  watch-arena:
    # Ordered after the models_extra writers only to serialize commits; the
    # arena crawl is independent of channel snapshot drift and always runs.
    needs: watch-goat-models
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch arena data
        run: |
          python3 watch-pipeline/scripts/watch_arena.py --top-n 0 --output data/arena.json

      - name: Commit arena snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/arena.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Arena snapshot changes"
          else
            git commit -m "data: update Arena snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit arena error state
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add watch-pipeline/reference/arena/
          if ! git diff --cached --quiet; then
            git commit -m "watch-arena: record failure state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
