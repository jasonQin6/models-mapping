name: Watch Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # daily, UTC 00:00 = CST 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-data-writes
  cancel-in-progress: false

jobs:
  fetch-all-models:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch full models catalog
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://models.dev/models.json -o data/all_models.json
          echo "all_models.json: $(wc -c < data/all_models.json) bytes"

      - name: Commit all_models snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/all_models.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No all_models changes"
          else
            git commit -m "data: update all_models snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  fetch-provider-conf:
    # PublicProviderConf overlay catalog — a superset of models.dev (manual
    # templates + live fetchers) that also carries per-model canonical_model_id
    # declarations; the card-source tier above all_models.json for the
    # axonhub-admin compute layer. Ordered after fetch-all-models only to
    # serialize commits.
    needs: fetch-all-models
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PublicProviderConf aggregate
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 \
            https://raw.githubusercontent.com/ThinkInAIXYZ/PublicProviderConf/dev/dist/all.json \
            -o data/provider_conf.json
          echo "provider_conf.json: $(wc -c < data/provider_conf.json) bytes"

      - name: Commit provider_conf snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/provider_conf.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No provider_conf changes"
          else
            git commit -m "data: update provider_conf snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  fetch-opencode-go:
    # Ordered after fetch-all-models only to serialize commits; the go.mdx
    # list is independent of models.dev drift, so this job is never gated on it.
    needs: fetch-all-models
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch source document
        env:
          GO_COMMIT_API_URL: https://api.github.com/repos/anomalyco/opencode/commits?path=packages/web/src/content/docs/go.mdx&sha=dev&per_page=1
        run: |
          set -euo pipefail
          latest_hash="$(curl -fsSL --max-time 30 "$GO_COMMIT_API_URL" | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["sha"])')"
          curl -fsSL --max-time 30 \
            "https://raw.githubusercontent.com/anomalyco/opencode/$latest_hash/packages/web/src/content/docs/go.mdx" \
            -o "$RUNNER_TEMP/go.mdx"

      - name: Update opencode-go section of models_extra
        run: |
          python3 .agents/skills/watch-pipeline/scripts/watch_go.py "$RUNNER_TEMP/go.mdx" \
            --extra data/models_extra.json

      - name: Commit models_extra
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/models_extra.json
          # A success clears the channel's last-error.json; commit its
          # removal in the same batch as the data change.
          if [ -d .agents/skills/watch-pipeline/reference/go ]; then
            git add .agents/skills/watch-pipeline/reference/go
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No opencode-go changes"
          else
            git commit -m "data: update opencode-go section of models_extra"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit opencode-go error state
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          if [ -d .agents/skills/watch-pipeline/reference/go ]; then
            git add .agents/skills/watch-pipeline/reference/go
          fi
          if ! git diff --cached --quiet; then
            git commit -m "watch-go: record failure state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

# Arena collection moved to its own weekly workflow (watch-arena.yml): the
# leaderboard moves slowly, the crawler is the most brittle of the channels,
# and daily runs bought nothing the mapping formula needs.
