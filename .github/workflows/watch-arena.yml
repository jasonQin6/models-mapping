name: Watch Arena

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = UTC+8 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-data-writes
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Fetch arena data
        run: |
          python3 scripts/watch_arena.py --top-n 0 --output data/arena.json
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add data/arena.json
          if git diff --staged --quiet; then
            echo "No Arena snapshot changes"
          else
            git commit -m "data: update Arena snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
