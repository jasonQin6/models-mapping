name: Watch Arena

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = UTC+8 07:00
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Fetch arena data and merge
        run: |
          python3 scripts/watch_arena.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add models.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update arena data $(date +%y%m%d)"
            git push
          fi
