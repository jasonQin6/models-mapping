name: Watch OpenCode

on:
  schedule:
    - cron: '0 */4 * * *'  # 每 4 小时
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Check Atom feed for new commits
        id: check
        run: |
          ATOM_URL="https://github.com/anomalyco/opencode/commits/dev/packages/web/src/content/docs/go.mdx.atom"
          
          # Fetch Atom feed and extract latest commit hash
          FEED=$(curl -sL --max-time 30 "$ATOM_URL")
          LATEST_HASH=$(echo "$FEED" | grep -oP 'Grit::Commit/\K[a-f0-9]+' | head -1)
          
          if [[ -z "$LATEST_HASH" ]]; then
            echo "ERROR: Could not extract commit hash from Atom feed"
            exit 1
          fi
          
          echo "Latest commit: $LATEST_HASH"
          
          # Read stored hash
          HASH_FILE=".opencode-commit-hash"
          if [[ -f "$HASH_FILE" ]]; then
            STORED_HASH=$(cat "$HASH_FILE")
            echo "Stored hash: $STORED_HASH"
          else
            STORED_HASH=""
            echo "No stored hash (first run)"
          fi
          
          # Compare
          if [[ "$LATEST_HASH" == "$STORED_HASH" ]]; then
            echo "No new commits detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "$LATEST_HASH" > "$HASH_FILE"
          fi
      
      - name: Fetch and parse go.mdx
        id: parse
        if: steps.check.outputs.has_changes == 'true'
        run: |
          curl -sL "https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/go.mdx" -o go.mdx
          python3 scripts/parse_opencode_mdx.py go.mdx --output models.csv
          
          # Check if weighted columns changed
          if [[ -f .weighted-columns-changed ]]; then
            echo "weighted_changed=true" >> $GITHUB_OUTPUT
            rm .weighted-columns-changed
          else
            echo "weighted_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Fetch arena data and merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          python3 scripts/watch_arena.py
      
      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "40985853+github-actions[bot]@users.noreply.github.com"
          git add models.csv go.mdx .opencode-commit-hash
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update models.csv $(date +%y%m%d)"
            git push
          fi
      
      - name: Trigger compute-mapping if weighted columns changed
        if: steps.check.outputs.has_changes == 'true' && steps.parse.outputs.weighted_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run compute-mapping.yml
